<!DOCTYPE html>
<html>
<head>
    <title>Форма зв'язку - Владислав</title>
    <meta charset="UTF-8">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: 
                linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
                url('yolkifon.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white; 
        }
    </style>

</head>

<body>

    <h2 align="center">Форма зворотного зв'язку</h2>

    <form align="center">

        <p>
            Ім'я: <br>
            <input type="text" required>
        </p>

        <p>
            Email: <br>
            <input type="email" required>
        </p>

        <p>
            Тема повідомлення: <br>
            <input type="text">
        </p>

        <p>
            Повідомлення: <br>
            <textarea rows="5" cols="30" required></textarea>
        </p>

        <p>
            <input type="submit" value="Надіслати">
        </p>

    </form>

</body>
</html>
